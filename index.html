<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e5c82" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10171b" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Castaway" />
    <meta name="description" content="Stranded on an island idle survival game." />
    <title>Castaway Idle</title>
    <script>
      // Bootstrap owns theming; it switches on data-bs-theme rather than a
      // media query. Set it inline, before first paint, to avoid a flash of
      // the light theme on a dark device.
      ;(function () {
        var query = window.matchMedia('(prefers-color-scheme: dark)')
        var apply = function () {
          document.documentElement.setAttribute('data-bs-theme', query.matches ? 'dark' : 'light')
        }
        apply()
        query.addEventListener('change', apply)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
